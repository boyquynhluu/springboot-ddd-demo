name: Java CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: springboot-multiple-module-v2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Project
        run: mvn clean package

      - name: Check SonarQube
        run: |
          Invoke-WebRequest http://localhost:9000/api/system/status

      - name: SonarQube Scan
        run: >
          mvn
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=springboot-multiple-module-v2
          -Dsonar.host.url=http://localhost:9000
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Debug current directory
        run: |
          pwd
          ls -la

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build `
            -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest `
            .

      - name: Verify app.jar size
        run: |
          docker run --rm `
            --entrypoint sh `
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest `
            -c "ls -lh /app/app.jar"

      - name: Push Docker Image
        run: |
          docker push `
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest
